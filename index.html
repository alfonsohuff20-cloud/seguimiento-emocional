<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro">
<meta name="theme-color" content="#fbf7f0">
<meta name="robots" content="noindex,nofollow">
<title>Seguimiento Emocional – Registro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fbf7f0;--card:#fffdf9;--fg:#2e2a36;--muted:#8c8496;--line:#ece4d8;--soft:#f4eee4;
  --accent:#8e7cf0;--accent-fg:#fff;--danger:#d9707a;--ok:#4fae93;--warn:#e2a14a;--chip-on:#2e2a36;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[data-theme="oscuro"]{
  --bg:#07070b;--card:#111118;--fg:#ecebf7;--muted:#8a89a3;--line:#23232f;--soft:#1a1a24;
  --accent:#00e5ff;--accent-fg:#00161a;--danger:#ff4d7d;--ok:#00f5a0;--warn:#ffb300;--chip-on:#07070b;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-top:var(--sat);overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:650}
.muted{color:var(--muted)} .small{font-size:.82rem}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
[data-theme="oscuro"] .card{box-shadow:0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border:0}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;display:block}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=datetime-local],input[type=number]{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--danger);color:#fff;font-size:.72rem;font-weight:700;text-align:center}
.pill{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.pill button{border:0;background:transparent;padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:600}
.pill button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* PIN */
#pin{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding-top:var(--sat)}
#pin .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
#dots{display:flex;gap:14px;margin:18px 0 26px;height:16px}
#dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
#dots span.f{background:var(--accent);border-color:var(--accent)}
#pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px}
#pad button{height:78px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.7rem}
#pad button:active{background:var(--soft)}
#pad button.t{border:0;background:transparent;font-size:1rem;color:var(--muted)}
.shake{animation:sh .35s}@keyframes sh{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

/* app */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
main{padding-bottom:calc(150px + var(--sab))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
nav.bottom button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
nav.bottom button .i{font-size:1.35rem;line-height:1}
nav.bottom button.on{color:var(--accent)}
nav.bottom .badge{position:absolute;top:0;left:calc(50% + 6px)}
#savebar{position:fixed;left:0;right:0;bottom:calc(62px + var(--sab));z-index:15;padding:8px 12px}
#savebar .btn{width:100%;font-size:1.08rem;min-height:54px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

details.sec{background:var(--card);border-radius:18px;margin:10px 12px;overflow:hidden}
[data-theme="oscuro"] details.sec{box-shadow:0 0 0 1px var(--line)}
details.sec>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:8px;font-weight:650;font-size:1.05rem}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
details.sec[open]>summary .chev{transform:rotate(90deg)}
.cnt{font-size:.75rem;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.it{padding:12px 16px;border-top:1px solid var(--line)}
.it-h{display:flex;align-items:center;gap:8px;min-height:28px}
.it-n{font-weight:600}
.it-v{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.95rem}
.it.u .it-v{color:var(--muted)}
.x{border:0;background:var(--soft);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:.9rem}
.hint{font-size:.74rem;color:var(--muted)}
/* slider propio: arrastre horizontal, tap = salto, scroll vertical intacto */
.sl{position:relative;height:44px;touch-action:pan-y;margin:2px 4px}
.sl .tr{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:99px;background:var(--soft)}
.sl .fi{position:absolute;left:0;top:18px;height:8px;border-radius:99px;background:var(--c)}
.sl .th{position:absolute;top:8px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--card);border:3px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.it.u .sl .fi{background:var(--line)} .it.u .sl .th{border-color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:8px 14px;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--c,var(--accent));border-color:transparent;color:var(--chip-on);font-weight:650}
.ctx{padding:12px 16px;border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:1.4rem}
.step .val{min-width:84px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.ctx.u .val{color:var(--muted);font-weight:500}
.rec{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .h{font-weight:700;width:50px;font-variant-numeric:tabular-nums}
.rec .b{flex:1;min-width:0;font-size:.86rem}
.st{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 8px}
.st.p{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.st.e{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.note{font-size:.84rem;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px}
#toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;z-index:100;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:flex;align-items:flex-end}
#dlg>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--sab))}
</style>
</head>
<body>
<div id="pin">
  <div class="logo"><svg width="38" height="38" viewBox="0 0 64 64"><path d="M6 36 L18 36 L25 18 L35 48 L42 28 L47 36 L58 36" fill="none" stroke="var(--accent-fg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2>Seguimiento Emocional</h2>
  <div class="muted small" id="pinmsg">Ingresá tu PIN</div>
  <div id="dots"></div>
  <div id="pad"></div>
</div>

<div id="app" hidden>
  <header class="top"><div class="row"><h2 id="titulo">Registrar</h2><div class="spacer"></div><button class="x" id="btn-lock" aria-label="Bloquear">🔒</button></div></header>
  <main>
    <section id="v-reg"></section>
    <section id="v-hist" hidden></section>
    <section id="v-env" hidden></section>
    <section id="v-cfg" hidden></section>
  </main>
  <div id="savebar"><button class="btn primary" id="btn-guardar">Guardar</button></div>
  <nav class="bottom">
    <button data-v="reg" class="on"><span class="i">✎</span>Registrar</button>
    <button data-v="hist"><span class="i">☰</span>Registros</button>
    <button data-v="env"><span class="i">⇪</span>Enviar a la PC<span class="badge" id="nb" hidden></span></button>
    <button data-v="cfg"><span class="i">⚙</span>Ajustes</button>
  </nav>
</div>
<div id="toast"></div>
<div id="dlg" hidden><div id="dlgc"></div></div>

      el('button', { class: 'chip' + (reg ? ' on' : ''), onclick: () => { if (reg) delete F.ctx[v.id]; else F.ctx[v.id] = p ? p.d : 7; renderCtx(); } }, 'Sobrescribir'),
      reg ? el('div', { class: 'step' }, el('button', { onclick: () => { F.ctx[v.id] = Math.max(0, F.ctx[v.id] - 1); renderCtx(); } }, '−'), el('span', { class: 'val' }, `${F.ctx[v.id]} días`), el('button', { onclick: () => { F.ctx[v.id]++; renderCtx(); } }, '+')) : null));
}
function filaOpcion(v) {
  const multi = v.tipo === 'multiple', x = F.ctx[v.id];
  const ops = (v.opciones || []).map(o => [o.id, o.nombre]); if (multi) ops.push([NADIE, 'Nadie']);
  const click = id => {
    if (!multi) { if (x === id) delete F.ctx[v.id]; else F.ctx[v.id] = id; }
    else if (id === NADIE) { if (Array.isArray(x) && !x.length) delete F.ctx[v.id]; else F.ctx[v.id] = []; }
    else {
      const cur = Array.isArray(x) ? [...x] : []; const i = cur.indexOf(id); i >= 0 ? cur.splice(i, 1) : cur.push(id);
      const orden = (v.opciones || []).map(o => o.id); cur.sort((a, b) => orden.indexOf(a) - orden.indexOf(b));
      if (cur.length) F.ctx[v.id] = cur; else delete F.ctx[v.id];
    }
    renderCtx();
  };
  const on = id => multi ? (Array.isArray(x) && (id === NADIE ? !x.length : x.includes(id))) : x === id;
  return el('div', { class: 'ctx' + (x === undefined ? ' u' : '') }, cabCtx(v, x === undefined ? el('span', { class: 'small muted' }, multi ? 'podés marcar varios' : 'elegí uno') : null),
    el('div', { class: 'chips wrap' }, ops.map(([id, n]) => el('button', { class: 'chip' + (on(id) ? ' on' : ''), style: id === NADIE ? '--c:var(--muted)' : '', onclick: () => click(id) }, n))));
}
$('#btn-guardar').onclick = () => {
  const valores = Object.entries(F.vals).filter(([k]) => item(k)).map(([k, s]) => ({ item: k, valor: Math.round(s.v * 10) / 10, desencadenante: s.d || null }));
  const contexto = {}; for (const [k, x] of Object.entries(F.ctx)) if (varr(k)) contexto[k] = x;
  if (!valores.length && !Object.keys(contexto).length) { toast('Tocá al menos un deslizador o dato'); return; }
  const ahora = isoLocal(new Date());
  if (F.edit) {
    const r = REGS.find(r => r.id === F.edit);
    if (r) { const ya = !!r.enviado; Object.assign(r, { fecha: F.fecha || r.fecha, valores, contexto, modificado: ahora, enviado: null });
      toast(ya ? '✓ Cambios guardados · se reenvían en el próximo envío' : '✓ Cambios guardados'); }
  } else {
    REGS.push({ id: uid(), fecha: F.fecha || ahora, valores, contexto, demo: false, origen: 'movil', creado: ahora, modificado: ahora, enviado: null });
    toast(`✓ Guardado · ${valores.length} ítem${valores.length === 1 ? '' : 's'}${Object.keys(contexto).length ? ' + contexto' : ''}`);
  }
  REGS.sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  guardarRegs(); nuevoForm(); renderReg(); badge(); window.scrollTo({ top: 0, behavior: 'smooth' });
};

/* ---------- registros ---------- */
let histDias = 7;
function renderHist() {
  const v = $('#v-hist'); v.innerHTML = '';
  const desde = dayKey(new Date(Date.now() - (histDias - 1) * 864e5));
  const recs = REGS.filter(r => r.fecha.slice(0, 10) >= desde).slice().reverse();
  v.append(el('div', { class: 'card row' }, el('div', { class: 'pill' }, [[1, 'Hoy'], [7, '7 días'], [30, '30 días']].map(([d, t]) => el('button', { class: histDias === d ? 'on' : '', onclick: () => { histDias = d; renderHist(); } }, t))),
    el('span', { class: 'small muted' }, `${recs.length} registro${recs.length === 1 ? '' : 's'}`)));
  if (!recs.length) { v.append(el('p', { class: 'muted', style: 'text-align:center;margin-top:30px' }, 'No hay registros en este período en el teléfono.')); return; }
  let dia = null, card = null;
  for (const r of recs) {
    const k = r.fecha.slice(0, 10);
    if (k !== dia) { dia = k; card = el('div', { class: 'card' }, el('h3', { style: 'font-size:.95rem;margin-bottom:4px' }, cap(fmtLargo(k)))); v.append(card); }
    const vals = r.valores.map(x => { const it = item(x.item); return it ? `<span style="color:${colorIt(it)}">●</span> ${it.nombre} <b>${f1(x.valor)}</b>` : ''; }).filter(Boolean).join(' · ');
    const ctx = Object.entries(r.contexto || {}).map(([k2, x]) => { const vv = varr(k2); return vv ? `${vv.nombre}: ${textoCtx(vv, x)}` : ''; }).filter(Boolean).join(' · ');
    card.append(el('div', { class: 'rec' }, el('div', { class: 'h' }, r.fecha.slice(11, 16)),
      el('div', { class: 'b' }, el('div', { html: vals || '<span class="muted">Solo contexto</span>' }), ctx ? el('div', { class: 'small muted', style: 'margin-top:3px' }, ctx) : null,
        el('div', { class: 'row', style: 'margin-top:8px;gap:8px' },
          el('span', { class: 'st ' + (r.enviado ? 'e' : 'p') }, r.enviado ? '✓ enviado' : '⏳ pendiente'), el('span', { class: 'spacer' }),
          el('button', { class: 'chip', onclick: () => { nuevoForm(r); ir('reg'); } }, 'Editar'),
          el('button', { class: 'chip', style: 'color:var(--danger)', onclick: () => borrar(r) }, 'Borrar')))));
  }
}
function borrar(r) {
  dialogo('Borrar registro', r.enviado ? 'Este registro ya se envió a la PC: si lo borrás acá, también borralo en la app de la PC (Historial).' : '¿Borrar este registro del teléfono?',
    [{ txt: 'Borrar', cls: 'danger', fn: () => { REGS = REGS.filter(x => x !== r); guardarRegs(); renderHist(); badge(); } }, { txt: 'Cancelar' }]);
}

/* ---------- enviar a la PC ---------- */
function paquete(recs) {
  const limpio = recs.map(({ enviado, ...r }) => r);
  return { schema: 'seguimiento-emocional', version: 2, app: 'movil', tipo: 'envio_movil', exportado: isoLocal(new Date()),
    categorias: CFG.categorias, items: CFG.items, desencadenantes: CFG.desencadenantes, variables: CFG.variables, examenes: CFG.examenes || [],
    registros: limpio, config: {} };
}
async function enviar(recs, marcar = true) {
  if (!recs.length) { toast('No hay registros para enviar'); return; }
  const ahora = new Date();
  const nombre = `movil_${dayKey(ahora)}_${pad(ahora.getHours())}${pad(ahora.getMinutes())}${pad(ahora.getSeconds())}.json`;
  const json = JSON.stringify(paquete(recs));
  const file = new File([json], nombre, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
    else { const a = el('a', { href: URL.createObjectURL(file), download: nombre }); document.body.append(a); a.click(); a.remove(); }
  } catch (e) {
    if (e.name === 'AbortError') { toast('Envío cancelado: los registros siguen pendientes'); return; }
    toast('⚠ ' + e.message); return;
  }
  if (marcar) { const st = isoLocal(ahora); for (const r of recs) r.enviado = st; guardarRegs(); lsSet('ultimoEnvio', st); }
  toast(`✓ ${recs.length} registro${recs.length === 1 ? '' : 's'} listo${recs.length === 1 ? '' : 's'} para la PC`, 3200);
  renderEnv(); badge();
}
function renderEnv() {
  const v = $('#v-env'); v.innerHTML = '';
  const p = pendientes(), ult = ls('ultimoEnvio', null);
  v.append(el('div', { class: 'card', style: 'text-align:center' },
    el('div', { style: 'font-size:3rem;font-weight:750;font-variant-numeric:tabular-nums' }, p.length),
    el('div', { class: 'muted' }, `registro${p.length === 1 ? '' : 's'} pendiente${p.length === 1 ? '' : 's'} de enviar`),
    el('button', { class: 'btn primary block', style: 'margin-top:14px;min-height:56px;font-size:1.08rem', disabled: !p.length, onclick: () => enviar(p) }, '⇪  Enviar a la PC'),
    el('div', { class: 'small muted', style: 'margin-top:10px' }, ult ? `Último envío: ${cap(fmtLargo(ult))} ${ult.slice(11, 16)}` : 'Todavía no enviaste nada')));
  v.append(el('div', { class: 'card' }, el('h3', {}, 'Cómo enviar'),
    el('ol', { class: 'small', style: 'padding-left:18px;margin:8px 0 0' },
      el('li', {}, 'Tocá ', el('b', {}, 'Enviar a la PC'), '.'),
      el('li', {}, 'En el menú de compartir elegí ', el('b', {}, 'Drive'), ' (o ', el('b', {}, 'Guardar en Archivos → Google Drive'), ').'),
      el('li', {}, 'Guardalo en la carpeta ', el('b', {}, 'SeguimientoEmocional'), '.'),
      el('li', {}, 'En la PC tocá ', el('b', {}, '📱 Importar desde celular'), '.')),
    el('p', { class: 'note', style: 'margin-top:10px' }, 'Si cancelás el menú, los registros quedan pendientes. Si dudás de que haya llegado, podés reenviar: la PC no duplica registros.')));
  v.append(el('div', { class: 'card' }, el('h3', {}, 'Reenviar'),
    el('p', { class: 'small muted' }, 'Por si un envío no llegó a Drive.'),
    el('div', { class: 'row' },
      el('button', { class: 'btn', onclick: () => enviar(REGS.filter(r => r.fecha.slice(0, 10) === dayKey(new Date()))) }, 'Todo lo de hoy'),
      el('button', { class: 'btn', onclick: () => enviar(REGS.filter(r => diffDays(r.fecha.slice(0, 10), dayKey(new Date())) < 7)) }, 'Últimos 7 días'))));
}

/* ---------- ajustes ---------- */
function renderCfg() {
  const v = $('#v-cfg'); v.innerHTML = '';
  const fi = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: async e => { const f = e.target.files[0]; e.target.value = ''; if (f) importarConfig(await f.text()); } });
  v.append(el('div', { class: 'card' }, el('h3', {}, 'Configuración desde la PC'),
    el('p', { class: 'small muted' }, 'Ítems, opciones, desencadenantes, exámenes y PIN se editan en la app de la PC, que los deja en ',
      el('b', {}, 'Google Drive → SeguimientoEmocional → config_movil.json'), '. Cuando cambies algo allá, actualizá acá.'),
    fi, el('button', { class: 'btn primary block', onclick: () => fi.click() }, 'Actualizar configuración'),
    el('p', { class: 'small muted' }, `Configuración actual: ${CFG.exportado ? 'de la PC, ' + CFG.exportado.replace('T', ' ').slice(0, 16) : 'la de fábrica (PIN 1102)'} · ${itemsAct().length} ítems · ${varsAct().length} variables`)));
  v.append(el('div', { class: 'card' }, el('h3', {}, 'Tema'), el('div', { class: 'pill', style: 'margin-top:8px' },
    el('button', { class: tema() === 'claro' ? 'on' : '', onclick: () => { lsSet('tema', 'claro'); aplicarTema(); renderCfg(); } }, 'Claro – pastel'),
    el('button', { class: tema() === 'oscuro' ? 'on' : '', onclick: () => { lsSet('tema', 'oscuro'); aplicarTema(); renderCfg(); } }, 'Oscuro – neón'))));
  const enviados = REGS.filter(r => r.enviado).length;
  v.append(el('div', { class: 'card' }, el('h3', {}, 'Datos en el teléfono'),
    el('p', { class: 'small muted' }, `${REGS.length} registros guardados (${enviados} ya enviados). Los enviados de hace más de 60 días se borran solos del teléfono: ya están en la PC.`),
    el('p', { class: 'note' }, 'Importante: si borrás la app de la pantalla de inicio, iOS borra sus datos. Enviá a la PC antes.'),
    el('p', { class: 'small muted' }, `Versión ${APP_VERSION}`)));
}
function importarConfig(txt) {
  let d;
  try { d = JSON.parse(txt); } catch { toast('⚠ El archivo no es un JSON válido'); return; }
  if (d.schema !== 'seguimiento-emocional' || !Array.isArray(d.items) || !Array.isArray(d.variables)) { toast('⚠ No es un archivo de configuración de Seguimiento Emocional'); return; }
  if ((d.version || 1) > 2) { toast('⚠ Versión de datos más nueva que esta app: recargá la app'); return; }
  if ((d.version || 1) < 2) { toast('⚠ Archivo viejo (v1): actualizá la app de la PC'); return; }
  CFG = { categorias: d.categorias || [], items: d.items, desencadenantes: d.desencadenantes || [], variables: d.variables, examenes: d.examenes || [],
    config: { pin: (d.config && d.config.pin) || CFG.config.pin, tema: (d.config && d.config.tema) || 'claro' }, exportado: d.exportado || isoLocal(new Date()) };
  lsSet('cfg', CFG); nuevoForm(); aplicarTema(); renderCfg();
  toast('✓ Configuración actualizada');
}

/* ---------- inicio ---------- */
(function init() {
  // limpieza: registros ya enviados hace más de 60 días
  const lim = dayKey(new Date(Date.now() - 60 * 864e5));
  const antes = REGS.length; REGS = REGS.filter(r => !r.enviado || r.fecha.slice(0, 10) >= lim); if (REGS.length !== antes) guardarRegs();
  aplicarTema(); armarPin();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
